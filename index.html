<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Study Stack, caderno conectado do ecossistema de estudos."
    />
    <meta name="theme-color" content="#315f7a" />
    <title>Study Stack</title>

    <link rel="icon" href="assets/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icons/app-icon-192.png" />

    <link rel="stylesheet" href="styles/reset.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/typography.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/summary-editor-tabs.css" />
    <link rel="stylesheet" href="styles/record-cards.css" />
    <link rel="stylesheet" href="styles/exercise-practice-criteria.css" />
    <link rel="stylesheet" href="styles/settings.css" />
    <link rel="stylesheet" href="styles/restore-flow.css" />
    <link rel="stylesheet" href="styles/diagnostic-flow.css" />
    <link rel="stylesheet" href="styles/data-reset.css" />
    <link rel="stylesheet" href="styles/themes.css" />
    <link rel="stylesheet" href="styles/scrollbars.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
  </head>

  <body>
    <div class="app-shell" id="appShell">
      <header class="global-header">
        <div class="brand-group">
          <button
            class="icon-button navigation-toggle"
            id="navigationToggle"
            type="button"
            aria-label="Fechar navegação lateral"
            aria-controls="desktopSidebar mobileDrawer"
            aria-expanded="true"
          >
            <span aria-hidden="true">☰</span>
          </button>

          <div class="brand-mark" aria-hidden="true">
            <img
              class="brand-icon"
              src="assets/icons/app-icon.svg"
              alt=""
              width="42"
              height="42"
            />
          </div>

          <div class="brand-copy">
            <p class="eyebrow">Caderno conectado</p>
            <h1 class="brand-title">Study Stack</h1>
          </div>
        </div>

        <div class="header-actions">
          <span class="save-state" id="saveState">Salvo localmente</span>
          <button class="button button-primary" id="newRecordButton" type="button">
            Novo registro
          </button>
          <div class="utilities">
            <button
              class="icon-button"
              id="utilitiesButton"
              type="button"
              aria-label="Abrir utilidades"
              aria-expanded="false"
            >
              <span aria-hidden="true">⋯</span>
            </button>
            <div class="utilities-menu" id="utilitiesMenu" hidden>
              <button type="button" data-utility="backup">
                Backup JSON
                <span>Exportar estado</span>
              </button>
              <button type="button" data-utility="restore">
                Restaurar backup
                <span>Mesclar ou substituir</span>
              </button>
              <button type="button" data-utility="diagnostics">
                Diagnóstico
                <span>Integridade e armazenamento</span>
              </button>
              <div class="menu-separator" aria-hidden="true"></div>
              <p>Study Stack · v0.3.0</p>
            </div>
          </div>
        </div>
      </header>

      <section class="subject-context" id="subjectContext">
        <div class="subject-context-main">
          <nav class="breadcrumb" id="breadcrumb" aria-label="Contexto atual"></nav>
          <div class="subject-title-row">
            <div>
              <p class="eyebrow">Assunto atual</p>
              <h2 id="subjectTitle">Carregando contexto…</h2>
            </div>
            <div class="subject-status-group" id="subjectStatusGroup"></div>
          </div>
        </div>
        <button class="button button-return" id="returnButton" type="button">
          Voltar ao Concept Compass
        </button>
      </section>

      <div class="workspace">
        <aside class="sidebar" id="desktopSidebar" aria-label="Navegação principal">
          <nav class="sidebar-nav" id="sidebarNavigation"></nav>
        </aside>

        <main class="content-panel" id="contentPanel" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <script type="module" src="scripts/main.js"></script>
  </body>
</html>
